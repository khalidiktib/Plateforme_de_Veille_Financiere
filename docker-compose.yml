services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pvf-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: pvf_db
      POSTGRES_USER: pvf_admin
      POSTGRES_PASSWORD: finintel123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: